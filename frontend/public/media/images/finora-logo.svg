<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Zerodha-style brand blue: #387ED1 -->

  <!-- Mark: smaller rounded square, sized for navbar height -->
  <g transform="translate(0,8)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#387ED1"/>

    <!-- Upward trend arrow, scaled to the smaller mark -->
    <polyline points="15,60 31,44 42,53 65,25"
              fill="none" stroke="#FFFFFF" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="65,25 50,23 61,37" fill="#FFFFFF"/>

    <!-- Base line -->
    <line x1="10" y1="66" x2="70" y2="66" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Wordmark: large, wide, sits right next to the mark -->
  <text x="98" y="58" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="52" letter-spacing="1" fill="#14324F">Finora</text>

  <!-- Tagline -->
  <text x="100" y="80" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="13" letter-spacing="3" fill="#387ED1">TRADE SMARTER</text>
</svg>
